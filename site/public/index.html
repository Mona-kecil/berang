<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berang · Your Mac, reading to you</title>
<meta name="description" content="Berang reads web pages, PDFs, and books aloud on your Mac, in a natural voice. Free, and nothing you read leaves your Mac.">
<link rel="icon" href="assets/otter-peeking.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Tokens from mac/Sources/Berang/Theme.swift */
  :root {
    --mint: #DFF3EF; --card: #fff; --edge: #B7DCD6; --ink: #123B3A; --soft: #4D7C79; --teal: #0F7D7A;
    --orange: #E0661F; --orange-edge: #A74B16; --hair: rgba(18,59,58,.12); --shadow: rgba(18,59,58,.18);
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --round: ui-rounded, Nunito, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--mint); color: var(--ink); font-family: var(--round); font-weight: 600; -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 8px; }
  ::selection { background: rgba(15,125,122,.28); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

  .press { transition: transform 140ms var(--ease-out); }
  .press:active { transform: scale(.96); }

  .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 18px; color: #fff;
    background: var(--orange); padding: 15px 26px; border-radius: 16px; box-shadow: 0 4px 0 var(--orange-edge);
    transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--orange-edge); }
  .btn svg { width: 20px; height: 20px; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 22px; text-decoration: none; }
  .logo img { width: 38px; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; padding: 40px 0 0; }
  h1 { font-size: clamp(44px, 8vw, 84px); line-height: .98; font-weight: 900; letter-spacing: -.025em; }
  h1 span { color: var(--teal); }
  .cmd { margin: 36px auto 0; display: flex; align-items: center; gap: 6px; max-width: 560px; background: var(--ink); color: #fff; border-radius: 16px;
    padding: 8px 8px 8px 20px; box-shadow: 0 4px 0 #0A2726; text-align: left; }
  .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 600 15px/1.4 ui-monospace, "SF Mono", Menlo, monospace; padding: 8px 0; scrollbar-width: none; }
  .cmd code::-webkit-scrollbar { display: none; }
  .cmd code::selection { background: rgba(255,255,255,.3); }
  .cmd button { flex: none; min-width: 88px; background: var(--orange); color: #fff; font-weight: 800; font-size: 15px; padding: 10px 16px; border-radius: 11px; box-shadow: 0 3px 0 var(--orange-edge); }
  .hero .note { margin: 14px auto 0; max-width: 46ch; font-size: 14px; font-weight: 700; color: var(--soft); }
  .hero .note a { color: var(--teal); font-weight: 800; }
  .steps { display: inline-grid; gap: 6px; padding: 0; list-style: none; text-align: left; counter-reset: step; color: var(--ink); }
  .steps li { counter-increment: step; display: flex; align-items: center; gap: 8px; }
  .steps li::before { content: counter(step); flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 12px; display: grid; place-items: center; }
  .steps kbd { font: inherit; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--card); box-shadow: inset 0 -2px 0 var(--edge), 0 0 0 1px var(--edge); }

  .stage { position: relative; margin: 96px auto 0; max-width: 860px; }
  .stage .otter { position: absolute; z-index: 2; top: -77px; left: 16%; width: 150px; height: 80px; object-fit: cover; object-position: top; }
  .window { position: relative; z-index: 1; background: var(--card); border-radius: 22px; box-shadow: 0 6px 0 var(--edge); text-align: left; }
  .window .bar { display: flex; gap: 7px; padding: 16px 18px; }
  .window .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--edge); }
  .window .page { padding: 18px 56px 52px; }
  .page p { font-size: clamp(20px, 2.4vw, 26px); line-height: 1.65; font-weight: 700; }

  /* The reading highlight follows the voice and never eases, as Highlight.draw does in the app. */
  .s { border-radius: 6px; }
  .s.on { background: rgba(15,125,122,.10); box-shadow: 0 0 0 3px rgba(15,125,122,.10); }
  .w { border-radius: 5px; }
  .w.on { background: var(--orange); color: #fff; box-shadow: 0 0 0 3px var(--orange); }

  /* ---------- The floating player, after PlayerPanel.swift. It rests on an edge of the window. ---------- */
  .player { position: fixed; z-index: 50; top: 40%; right: 0; display: flex; align-items: flex-start; gap: 8px; touch-action: none; }
  .player[data-side="left"] { right: auto; left: 0; flex-direction: row-reverse; }
  .float { background: var(--card); box-shadow: 0 4px 18px var(--shadow), 0 0 0 1px var(--hair); }
  .pbar { width: 46px; padding: 6px 0; border-radius: 14px 0 0 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: grab; }
  .player[data-side="left"] .pbar { border-radius: 0 14px 14px 0; }
  .player.dragging .pbar { border-radius: 14px; cursor: grabbing; }
  .pbar .grip { width: 16px; height: 4px; border-radius: 2px; background: var(--hair); margin: 3px 0; }
  .pbar .main { width: 34px; height: 34px; border-radius: 50%; background: var(--orange); color: #fff; display: grid; place-items: center; }
  .pbar .main svg { width: 14px; height: 14px; }
  .pbar .main .play { transform: translateX(1px); }
  .pbar .spd { width: 40px; height: 28px; border-radius: 8px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pbar .spd[aria-expanded="true"] { background: var(--hair); }
  .pbar .more { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 200ms var(--ease-out), opacity 200ms var(--ease-out); }
  .player.open .more { grid-template-rows: 1fr; opacity: 1; }
  .pbar .more > div { overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pbar .ic { width: 30px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
  .pbar .ic svg { width: 11px; height: 11px; }
  .pbar .ic:disabled { opacity: .35; cursor: default; }

  .cards { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .player[data-side="left"] .cards { align-items: flex-start; }
  .player.dragging .cards { visibility: hidden; }
  .card { border-radius: 14px; transform-origin: top right; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
  .player[data-side="left"] .card { transform-origin: top left; }
  .card[hidden] { display: block; opacity: 0; transform: scale(.96); pointer-events: none; position: absolute; visibility: hidden; }
  .speedcard { width: 238px; padding: 12px; }
  .speedcard .row { display: flex; align-items: center; justify-content: space-between; }
  .speedcard .step { width: 32px; height: 32px; border-radius: 10px; background: var(--mint); color: var(--teal); display: grid; place-items: center; }
  .speedcard .step svg { width: 13px; height: 13px; }
  .speedcard .now { padding: 2px 8px; text-align: center; border-radius: 8px; }
  .speedcard .now b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .speedcard .now small { font-size: 11px; font-weight: 700; color: var(--soft); font-variant-numeric: tabular-nums; }
  .speedcard input { width: 100%; margin: 10px 0; accent-color: var(--teal); }
  .speedcard .presets { display: flex; gap: 5px; }
  .speedcard .presets button { flex: 1; min-height: 24px; border-radius: 8px; background: var(--mint); color: var(--teal); font-size: 11.5px; font-weight: 800; }
  .speedcard .presets button[aria-pressed="true"] { background: var(--teal); color: #fff; }
  .tip { display: flex; align-items: center; gap: 2px; padding: 6px 0 6px 12px; }
  .tip p { width: 184px; font-size: 11.5px; font-weight: 600; color: var(--soft); line-height: 1.35; }
  .tip kbd { font: inherit; font-weight: 800; color: var(--ink); }
  .tip button { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--soft); }
  .tip button svg { width: 8px; height: 8px; }

  /* ---------- The hard parts ---------- */
  .hard { padding-top: 140px; }
  h2 { font-size: clamp(34px, 5vw, 52px); line-height: 1.02; font-weight: 900; letter-spacing: -.02em; }
  .voices { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 20px; }
  .voice { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 7px; border-radius: 999px; background: var(--card); box-shadow: 0 3px 0 var(--edge); font-weight: 800; font-size: 15px; }
  .voice .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--mint); color: var(--teal); display: grid; place-items: center; }
  .voice .dot svg { width: 11px; height: 11px; }
  .voice[aria-pressed="true"] { background: var(--teal); color: #fff; box-shadow: 0 3px 0 #0A5754; }
  .voice[aria-pressed="true"] .dot { background: var(--orange); color: #fff; }
  .sample { position: relative; background: var(--card); border-radius: 22px; box-shadow: 0 6px 0 var(--edge); padding: 64px 48px 48px; }
  .sample p { font-size: clamp(19px, 2.3vw, 25px); line-height: 1.85; font-weight: 700; }
  .says { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; white-space: nowrap; background: var(--ink); color: #fff; font-size: 14px; font-weight: 800;
    padding: 6px 11px; border-radius: 10px; opacity: 0; transform: translateY(4px); transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out); }
  .says.on { opacity: 1; transform: translateY(0); }
  .says::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -5px; width: 10px; height: 10px; background: var(--ink); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }

  /* ---------- Get it ---------- */
  footer { border-top: 2px solid var(--edge); margin-top: 120px; padding: 22px 0 48px; display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--soft); font-weight: 700; }

  @media (hover: none) { .player .more { grid-template-rows: 1fr; opacity: 1; } }
  @media (max-width: 720px) {
    .stage { margin-top: 84px; }
    .stage .otter { left: 8%; width: 120px; height: 64px; top: -62px; }
    .window .page { padding: 8px 22px 36px; }
    .sample { padding: 56px 22px 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .press, .card, .says, .pbar .more { transition-property: opacity !important; transform: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav><a class="logo" href="#"><img src="assets/otter-peeking.png" alt="">Berang</a></nav>

  <header class="hero">
    <h1>Your Mac,<br><span>reading to you.</span></h1>
    <div class="cmd"><code id="install">curl -fsSL berang.monosodiums.com/install | sh</code><button class="press" id="copy">Copy</button></div>
    <div class="note" id="get-note" role="status">Copy and paste into Terminal to install Berang (Apple silicon, macOS 15 or later).</div>
    <p class="note"><a data-download href="#">Or download the zip</a></p>
    <div class="stage">
      <img class="otter" src="assets/otter-peeking.png" alt="">
      <div class="window">
        <div class="bar" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="page"><p id="hero-text"></p></div>
      </div>
    </div>
  </header>

  <section class="hard" aria-labelledby="hard-title">
    <h2 id="hard-title">It reads the hard parts too.</h2>
    <div class="voices" id="voices" role="group" aria-label="Voice"></div>
    <div class="sample" id="sample"><p id="hard-text"></p><div class="says" id="says" aria-hidden="true"></div></div>
  </section>

  <footer><span>Free and open source</span><a href="https://github.com/Mona-kecil/berang">Source code</a><a href="mailto:michael@monosodiums.com?subject=Berang%20feedback">Send feedback</a></footer>
</div>

<div class="player" id="player" role="group" aria-label="Berang player" data-side="right">
  <div class="cards">
    <div class="card float speedcard" id="speedcard" hidden>
      <div class="row">
        <button class="step press" data-step="-1" aria-label="Slower"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
        <button class="now press" id="reset" aria-label="Back to 1×"><b id="speed-big">1×</b><small id="wpm"> </small></button>
        <button class="step press" data-step="1" aria-label="Faster"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6 2v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </div>
      <input id="slider" type="range" min="0.5" max="3" step="0.1" value="1" aria-label="Speed">
      <div class="presets" id="presets"></div>
    </div>
    <div class="card float tip" id="tip" hidden><p id="tip-text"></p><button id="tip-x" aria-label="Dismiss tip"><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1 1l6 6M7 1 1 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
  </div>
  <div class="pbar float" id="pbar">
    <div class="grip" aria-hidden="true"></div>
    <button class="main press" id="main" aria-label="Play"></button>
    <button class="spd press" id="spd" aria-expanded="false" aria-controls="speedcard">1×</button>
    <div class="more"><div>
      <button class="ic press" data-skip="-1" aria-label="Previous sentence"><svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 6l5-4v8zM1 6l5-4v8z"/></svg></button>
      <button class="ic press" data-skip="1" aria-label="Next sentence"><svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M6 6 1 2v8zm5 0L6 2v8z"/></svg></button>
      <button class="ic press" id="stop" aria-label="Stop"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2 2 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div></div>
  </div>
</div>

<script src="assets/timing.js"></script>
<script>

const $ = id => document.getElementById(id);
const STEPS = ["Press <kbd>⌘ Space</kbd>, type Terminal, press Return.", "Press <kbd>⌘ V</kbd> to paste.", "Press Return."];
// macOS blocks an app downloaded in a browser the first time, so say how to open it once the zip is downloading.
const ZIPPED = "This otter only has pebbles, not $99/year for Apple, so macOS will stop it once. Unzip, move Berang to Applications, and open it. Go to System Settings › Privacy & Security, scroll down, and click “Open Anyway”. Built by GitHub from the public code.";
const steps = list => `<ol class="steps">${list.map(t => `<li><span>${t}</span></li>`).join("")}</ol>`;
document.querySelector("[data-download]").href = "https://github.com/Mona-kecil/berang/releases/latest/download/Berang.zip";
document.querySelector("[data-download]").addEventListener("click", () => $("get-note").textContent = ZIPPED);
$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("install").textContent);
    $("copy").textContent = "Copied";
    $("get-note").innerHTML = steps(STEPS);
  } catch {
    // Without clipboard access, select the command so ⌘ C copies it.
    getSelection().selectAllChildren($("install"));
    $("get-note").innerHTML = steps(["Press <kbd>⌘ C</kbd> to copy.", ...STEPS]);
  }
};
const ICON = {
  play: '<svg class="play" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3 1.6v10.8a.8.8 0 0 0 1.2.7l8.6-5.4a.8.8 0 0 0 0-1.4L4.2.9A.8.8 0 0 0 3 1.6z"/></svg>',
  pause: '<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx=".8"/><rect x="8.3" y="1.5" width="3.2" height="11" rx=".8"/></svg>',
};
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const bare = s => s.toLowerCase().replace(/[^a-z0-9']/g, "");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const touch = matchMedia("(hover: none)");
// What this visitor chose, kept like the app keeps it. Private windows may refuse storage; the page works without it.
const saved = {
  get(k) { try { return JSON.parse(localStorage.getItem("berang." + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("berang." + k, JSON.stringify(v)); } catch {} },
};

/* Spoken words that share source text form one group: "$3.5M" is said as five words. */
function render(el, t) {
  const groups = [], ofWord = [];
  t.source.forEach(([lo, hi], i) => {
    const g = groups.at(-1);
    if (g && lo < g.hi) { g.hi = Math.max(g.hi, hi); g.say.push(t.say[i]); }
    else groups.push({ lo, hi, say: [t.say[i]], first: i });
    ofWord[i] = groups.length - 1;
  });
  let html = '<span class="s">', pos = 0, endSentence = false;
  groups.forEach(g => {
    const between = esc(t.text.slice(pos, g.lo));
    html += endSentence ? `</span>${between}<span class="s">` : between;
    const last = g.say.at(-1), src = t.text.slice(g.lo, g.hi);
    // Punctuation the voice also keeps stays outside the highlight, so "day." lights up as "day".
    const tail = (src.match(/[.,;:!?]+$/) || [""])[0], keep = last.endsWith(tail) ? tail : "";
    const core = keep ? src.slice(0, -keep.length) : src;
    html += `<span class="w">${esc(core)}</span>${esc(keep)}`;
    g.spoken = g.say.join(" ").replace(/[.,;:!?]+$/, "");
    g.rewritten = bare(g.spoken) !== bare(core);
    g.startsSentence = endSentence || pos === 0;
    endSentence = /[.!?]$/.test(last);
    pos = g.hi;
  });
  el.innerHTML = html + esc(t.text.slice(pos)) + "</span>";
  const spans = [...el.querySelectorAll(".w")];
  groups.forEach((g, k) => { g.el = spans[k]; g.sentence = spans[k].parentElement; });
  return { groups, ofWord };
}

/* Plays one recording and keeps the highlight on the word being said. The player drives whichever reader is active. */
const readers = [];
let active = null, speed = 1;
function reader({ el, timing, folder, voice }) {
  const { groups, ofWord } = render(el, timing);
  const audio = new Audio(); audio.preload = "auto";
  let starts, current = -1, raf = 0;
  const r = {
    el, groups, audio,
    get playing() { return !audio.paused; },
    get word() { return current; },
    get pace() { return timing.say.length / (starts.at(-1) + .6) * 60; },
    load(name) { voice = name; starts = timing.voices[name]; audio.src = `assets/${folder}/${encodeURIComponent(name)}.m4a`; },
    play() {
      readers.forEach(o => { if (o !== r && o.playing) o.pause(); });
      active = r; audio.playbackRate = speed; audio.play(); loop(); changed();
    },
    pause() { audio.pause(); cancelAnimationFrame(raf); changed(); },
    stop() { r.pause(); audio.currentTime = 0; mark(-1); changed(); },
    seek(word) { audio.currentTime = Math.max(0, starts[word] - .05); mark(word); },
    wordAt(t) { let i = -1; for (let k = 0; k < starts.length && starts[k] <= t; k++) i = k; return i; },
    groupOf(word) { return word < 0 ? -1 : ofWord[word]; },
  };
  function mark(i) {
    const before = current < 0 ? null : groups[ofWord[current]], after = i < 0 ? null : groups[ofWord[i]];
    current = i;
    if (before === after) return;
    before?.el.classList.remove("on"); after?.el.classList.add("on");
    if (before?.sentence !== after?.sentence) { before?.sentence.classList.remove("on"); after?.sentence.classList.add("on"); }
    r.onWord?.(after);
  }
  function loop() { mark(r.wordAt(audio.currentTime)); raf = requestAnimationFrame(loop); }
  audio.addEventListener("ended", () => { cancelAnimationFrame(raf); audio.currentTime = 0; mark(-1); changed(); });
  r.load(voice);
  readers.push(r);
  return r;
}
function changed() { drawPlayer(); drawVoices(); }

const hero = reader({ el: $("hero-text"), timing: TIMING.hero, folder: "hero", voice: "eleanor" });
const hard = reader({ el: $("hard-text"), timing: TIMING.hard, folder: "hard", voice: "eleanor" });
active = hero;

/* The reader to start when nothing is underway: the one you can see most of. */
function inView() {
  const seen = r => { const b = r.el.getBoundingClientRect(); return Math.max(0, Math.min(b.bottom, innerHeight) - Math.max(b.top, 0)); };
  return readers.reduce((a, b) => seen(b) > seen(a) ? b : a);
}
function playPause() {
  if (active.playing) return active.pause();
  (active.word >= 0 ? active : inView()).play();
  learn("start");
}

/* ---------- The player ---------- */
const player = $("player"), pbar = $("pbar"), main = $("main"), spd = $("spd"), speedcard = $("speedcard");
const label = s => (Math.round(s * 10) / 10).toString() + "×";

function drawPlayer() {
  main.innerHTML = active.playing ? ICON.pause : ICON.play;
  main.setAttribute("aria-label", active.playing ? "Pause" : "Play");
  document.querySelectorAll("[data-skip]").forEach(b => b.disabled = active.word < 0 && !active.playing);
  $("wpm").textContent = `≈ ${Math.round(active.pace * speed)} words/min`;
  showTip();
}
// One speed for every reading, remembered across visits, from 0.5× to 3× in steps of 0.1×.
function setSpeed(s, learnt = true) {
  speed = Math.min(3, Math.max(.5, Math.round(s * 10) / 10));
  readers.forEach(r => r.audio.playbackRate = speed);
  spd.textContent = label(speed); spd.setAttribute("aria-label", `Speed, ${label(speed)}`);
  $("speed-big").textContent = label(speed);
  $("slider").value = speed;
  presets.forEach(b => b.setAttribute("aria-pressed", b.dataset.s == speed));
  drawPlayer();
  if (learnt) { saved.set("speed", speed); learn("speed"); }
}
const presets = [1, 1.5, 2, 2.5, 3].map(s => {
  const b = document.createElement("button"); b.className = "press"; b.dataset.s = s; b.textContent = label(s);
  b.onclick = () => setSpeed(s); $("presets").append(b); return b;
});
function showSpeed(open) { speedcard.hidden = !open; spd.setAttribute("aria-expanded", open); }
main.onclick = playPause;
spd.onclick = () => showSpeed(speedcard.hidden);
$("reset").onclick = () => setSpeed(1);
$("slider").oninput = e => setSpeed(+e.target.value);
document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => setSpeed(speed + b.dataset.step / 10));
$("stop").onclick = () => { active.stop(); showSpeed(false); };
document.querySelectorAll("[data-skip]").forEach(b => b.onclick = () => {
  // To the start of the next sentence; back to the start of this one, or the one before when just past its start.
  const gs = active.groups, here = Math.max(0, active.groupOf(active.word));
  const firsts = gs.map((g, k) => g.startsSentence ? k : -1).filter(k => k >= 0);
  let target;
  if (b.dataset.skip > 0) target = firsts.find(k => k > here);
  else { const cur = firsts.filter(k => k <= here).at(-1); target = here - cur < 2 ? firsts.filter(k => k < cur).at(-1) ?? cur : cur; }
  if (target === undefined) return active.stop();
  active.seek(gs[target].first);
});

// One step of 0.1× per wheel notch, or per 24 points of trackpad scrolling. Scrolling up is faster.
let scrolled = 0;
player.addEventListener("wheel", e => {
  e.preventDefault();
  const notch = e.deltaMode === 1 || (Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
  scrolled += notch ? -Math.sign(e.deltaY) : -e.deltaY / 24;
  while (Math.abs(scrolled) >= 1) { const up = Math.sign(scrolled); setSpeed(speed + up / 10); scrolled -= up; }
}, { passive: false });

// Pointing at the player shows skip and stop; they close a moment after the pointer leaves.
let closing;
player.addEventListener("pointerenter", e => { if (e.pointerType !== "mouse") return; clearTimeout(closing); player.classList.add("open"); learn("more"); });
player.addEventListener("pointerleave", e => { if (e.pointerType !== "mouse") return; closing = setTimeout(() => player.classList.remove("open"), 350); });
player.addEventListener("focusin", () => player.classList.add("open"));

/* Drag the player to either side. A throw counts where it was headed, and the spot you chose stays. */
let drag = null;
pbar.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest("button")) return;
  const b = player.getBoundingClientRect();
  drag = { dx: e.clientX - b.left, dy: e.clientY - b.top, x: e.clientX, y: e.clientY, path: [], moved: false };
  pbar.setPointerCapture(e.pointerId);
});
pbar.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return;
  if (!drag.moved) { drag.moved = true; player.classList.add("dragging"); showSpeed(false); }
  player.style.transition = "none"; player.style.transform = "";
  player.style.left = e.clientX - drag.dx + "px"; player.style.right = "auto"; player.style.top = e.clientY - drag.dy + "px";
  drag.path = [...drag.path.filter(p => e.timeStamp - p.t < 100), { x: e.clientX, t: e.timeStamp }];
});
pbar.addEventListener("pointerup", () => {
  const d = drag; drag = null;
  if (!d?.moved) return;
  const b = player.getBoundingClientRect(), p = d.path;
  const velocity = p.length > 1 ? (p.at(-1).x - p[0].x) / Math.max(p.at(-1).t - p[0].t, 1) * 1000 : 0;
  const side = b.left + b.width / 2 + velocity * .2 < innerWidth / 2 ? "left" : "right";
  place({ side, y: b.top / innerHeight }, b);
  learn("move");
});
function place(spot, from) {
  const y = Math.min(Math.max(spot.y * innerHeight, 8), innerHeight - pbar.offsetHeight - 8);
  player.classList.remove("dragging");
  player.dataset.side = spot.side;
  player.style.left = player.style.right = ""; player.style.top = y + "px";
  saved.set("spot", { side: spot.side, y: y / innerHeight });
  if (!from || reduceMotion.matches) return;
  // Slides from where you let go to the edge: drawn at the drop point, then eased to rest.
  const to = player.getBoundingClientRect();
  player.style.transition = "none";
  player.style.transform = `translate(${from.left - to.left}px, ${from.top - to.top}px)`;
  player.getBoundingClientRect();
  player.style.transition = "transform 300ms cubic-bezier(.23, 1, .32, 1)";
  player.style.transform = "";
}
addEventListener("resize", () => place(saved.get("spot") ?? { side: player.dataset.side, y: .4 }));

/* ---------- Shortcuts, as in the app ---------- */
addEventListener("keydown", e => {
  if (e.altKey && !e.metaKey && !e.ctrlKey && e.key === "Escape") {
    e.preventDefault();
    // With text selected in something Berang can read, read from there; otherwise start or pause.
    const sel = getSelection(), range = sel.rangeCount && !sel.isCollapsed ? sel.getRangeAt(0) : null;
    const r = range && readers.find(x => x.el.contains(range.startContainer));
    if (r) {
      const g = r.groups.find(g => range.intersectsNode(g.el)) ?? r.groups.find(g => range.comparePoint(g.el, 0) >= 0);
      if (g) { r.seek(g.first); r.play(); sel.removeAllRanges(); learn("jump"); return; }
    }
    playPause();
  } else if (e.altKey && e.shiftKey && (e.code === "Period" || e.code === "Comma") && active.playing) {
    e.preventDefault();
    setSpeed(speed + (e.code === "Period" ? .1 : -.1));
  }
});

/* ---------- Tips, as the player shows them: one at a time, gone once you use what it shows ---------- */
const TIPS = {
  start: () => "Press play to hear this page",
  jump: () => "To read from somewhere else, select it and press <kbd>⌥ esc</kbd>",
  speed: () => "Scroll over the player to change the speed",
  more: () => "Point at the player to skip or stop",
  move: () => "Drag the player to either side of the screen. It stays there.",
};
const learned = new Set(saved.get("tips") ?? []);
let tipShown = null;
function showTip() {
  // A touch screen can't scroll over or point at the player, and shows its controls already.
  const next = Object.keys(TIPS).find(k => !learned.has(k) && (!touch.matches || k === "start") && (k === "start" || active.playing));
  if (next === tipShown) return;
  tipShown = next ?? null;
  $("tip").hidden = !next;
  if (next) $("tip-text").innerHTML = TIPS[next]();
}
function learn(k) {
  if (learned.has(k)) return;
  learned.add(k); saved.set("tips", [...learned]);
  showTip();
}
$("tip-x").onclick = () => learn(tipShown);

/* ---------- The hard parts ---------- */
const VOICES = ["eleanor", "grace", "danny", "Maeve", "Edwin", "Old Mortlake"];
const sample = $("sample"), says = $("says");
hard.onWord = g => {
  if (!g || !g.rewritten) return says.classList.remove("on");
  says.textContent = `“${g.spoken}”`;
  const box = sample.getBoundingClientRect(), w = g.el.getClientRects()[0];
  const width = says.offsetWidth, mid = w.left + w.width / 2 - box.left;
  const left = Math.min(Math.max(8, mid - width / 2), box.width - width - 8);
  says.style.left = left + "px"; says.style.top = (w.top - box.top - says.offsetHeight - 10) + "px";
  says.style.setProperty("--tail", (mid - left) + "px");
  says.classList.add("on");
};
let chosen = "eleanor";
const voiceButtons = VOICES.map(id => {
  const name = id[0].toUpperCase() + id.slice(1);
  const b = document.createElement("button"); b.className = "voice press";
  b.innerHTML = `<span class="dot"></span>${name}`;
  b.onclick = () => {
    if (id === chosen) return hard.playing ? hard.pause() : hard.play();
    // Another voice picks up at the same word, so you hear the same phrase in both.
    const word = hard.playing ? hard.word : -1;
    hard.pause(); chosen = id; hard.load(id);
    hard.audio.addEventListener("loadedmetadata", () => { if (word >= 0) hard.seek(word); hard.play(); }, { once: true });
    drawVoices();
  };
  $("voices").append(b); return [id, name, b];
});
function drawVoices() {
  voiceButtons.forEach(([id, name, b]) => {
    const on = id === chosen, playing = on && hard.playing;
    b.setAttribute("aria-pressed", on);
    b.querySelector(".dot").innerHTML = playing ? ICON.pause : ICON.play;
    b.setAttribute("aria-label", `${playing ? "Pause" : "Play"} ${name}`);
  });
  if (!hard.playing && hard.word < 0) says.classList.remove("on");
}

place(saved.get("spot") ?? { side: "right", y: .4 });
setSpeed(saved.get("speed") ?? 1, false);
drawVoices();
</script>
</body>
</html>
