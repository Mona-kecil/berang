name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      # Keeps compiled dependencies, such as MLX, between runs, so a run compiles only what changed.
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('mac/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Check every voice preview has a profile
        run: |
          for clip in App/Previews/*/*.m4a; do
            engine=$(basename "$(dirname "$clip")"); voice=$(basename "$clip" .m4a)
            jq -e --arg e "$engine" --arg v "$voice" '.[$e][$v]' App/Previews/voices.json > /dev/null \
              || { echo "No profile for $engine/$voice in App/Previews/voices.json"; exit 1; }
          done
      # Builds every target, the app included, then runs the tests. The release workflow builds the signed app
      # alongside, on pull requests that change it.
      - run: swift test

  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bench/clean/test_clean.py

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the player, update, shortcut, placement and jump models with TLC
        working-directory: mac/Model
        run: |
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c
          java -cp tla2tools.jar tlc2.TLC -config Player.cfg -workers auto Player.tla
          java -cp tla2tools.jar tlc2.TLC -config Update.cfg -workers auto Update.tla
          java -cp tla2tools.jar tlc2.TLC -config Shortcuts.cfg -workers auto Shortcuts.tla
          java -cp tla2tools.jar tlc2.TLC -config Place.cfg -workers auto Place.tla
          java -cp tla2tools.jar tlc2.TLC -config Jump.cfg -workers auto Jump.tla
