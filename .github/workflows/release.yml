name: Release

# A tag like v0.2.0 publishes a signed Berang.zip to that tag's GitHub Release. A pull request that changes the app
# or how it is released builds the same zip and keeps it as a workflow artifact, which checks what the tests don't:
# the Metal shaders, the optimized build, the app's packaging, and its signature. On main, a change to how releases are
# built or to the dependencies rebuilds the cache that tags and pull requests build from.
on:
  push:
    tags: ["v*"]
    branches: [main]
    # GitHub skips path filters for tags, so every tag still releases.
    paths: [".github/workflows/release.yml", "mac/build-app.sh", "mac/Package.resolved"]
  pull_request:
    paths: [".github/workflows/release.yml", "mac/**", "install.sh"]

permissions:
  contents: write

jobs:
  release:
    # Pull requests from forks get no secrets, so they can't sign.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build-app.sh numbers builds by commit count

      # MLX compiles Metal shaders, which needs Xcode's Metal toolchain.
      - run: xcodebuild -downloadComponent MetalToolchain

      # Keeps Xcode's compiled dependencies, such as MLX, between runs. A tag can use only main's cache, which main
      # makes whenever the dependencies change.
      - uses: actions/cache@v4
        with:
          path: mac/.xcbuild
          key: xcbuild-${{ runner.os }}-${{ hashFiles('mac/Package.resolved') }}
          restore-keys: xcbuild-${{ runner.os }}-

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/berang.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/berang.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/berang.p12"

      - name: Build and sign
        working-directory: mac
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0; fi
          SIGN_IDENTITY=Berang VERSION=$version ./build-app.sh
          codesign -d -r- build/Berang.app
          ditto -c -k --keepParent build/Berang.app ../Berang.zip
          shasum -a 256 ../Berang.zip | cut -d ' ' -f 1 > ../Berang.zip.sha256

      # The feed Sparkle checks: the latest release's appcast.xml, describing that release's zip, with the zip and the
      # feed signed by the update key. generate_appcast also stops if that key doesn't match the app's SUPublicEDKey.
      - name: Write the update feed
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/sparkle" "$RUNNER_TEMP/feed"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          cp Berang.zip "$RUNNER_TEMP/feed/"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=v0.0.0; fi
          printf '%s\n' "$SPARKLE_ED_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" "$RUNNER_TEMP/feed"
          cp "$RUNNER_TEMP/feed/appcast.xml" appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Berang
          path: |
            Berang.zip
            Berang.zip.sha256
            appcast.xml

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Berang.zip Berang.zip.sha256 appcast.xml --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
